    
    <form method="POST" action="{% url 'search' %}">
      {% csrf_token %}
      <div class="input-group">
        <select class="usa-select search-category" name="category">
          <option>Genus and Species</option>
          <option>Family</option>
          <option>Order</option>
          <option>Gene</option>
          <option>Mitochondrion</option>
          <option>Chloroplast/Plastid</option>
        </select>
        <input class="usa-input" type="text" name="search_term" placeholder="Search organelle." aria-label="Search">
        <button class="usa-button" type="submit">
          Search
          </button>
        </div>
      </form>
